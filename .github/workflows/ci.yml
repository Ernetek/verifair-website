name: CI and production deploy

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: verifair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: E2E tests
        run: npx playwright install --with-deps chromium webkit && npm run test:e2e
      - name: Cloudflare build
        run: npm run cf:build

  deploy:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build for Cloudflare
        run: npm run cf:build
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Production smoke test
        shell: bash
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          set -euo pipefail

          if [ -z "${PRODUCTION_URL:-}" ]; then
            echo "::error::PRODUCTION_URL repository variable is not configured"
            exit 1
          fi

          base="${PRODUCTION_URL%/}"

          check_url() {
            path="$1"
            url="${base}${path}"
            echo "Checking ${url}"

            for attempt in 1 2 3 4 5; do
              status="$(curl --silent --show-error --location --output /tmp/response --write-out '%{http_code}' --max-time 20 "${url}" || true)"

              if [ "$status" = "200" ]; then
                echo "PASS ${path} -> HTTP 200"
                return 0
              fi

              echo "Attempt ${attempt}: ${path} -> HTTP ${status}"
              sleep 10
            done

            echo "::error::Production health check failed: ${path}"
            cat /tmp/response || true
            exit 1
          }

          check_url "/"
          check_url "/robots.txt"
          check_url "/demonstration/monitoring-room"

      - name: Record verified production deployment
        run: |
          echo "Production deployment verified"
          echo "Commit: $GITHUB_SHA"
          echo "URL: ${{ vars.PRODUCTION_URL }}"
